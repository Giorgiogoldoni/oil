name: Diagnose 3OIS Milano — isolated Yahoo history

on:
  push:
    branches: [main]
    paths:
      - "diagnose_3ois.py"
      - ".github/workflows/diagnose-3ois.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install data dependencies
        run: pip install -r requirements.txt
      - name: Isolated 3OIS.MI download diagnostics
        run: python diagnose_3ois.py
      - name: Upload diagnostic report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: diagnose-3ois-milano
          path: |
            diagnostic_3ois.json
            diagnostic_3ois_mi.csv
          if-no-files-found: ignore
